[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-srt"
version = "0.2.1"
description = "Local speech-to-SRT worker using Qwen3-ASR and Qwen3 ForcedAligner."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "qwen-asr>=0.0.6",
    "torch>=2.6",
    "huggingface-hub>=0.25",
    "opencc-python-reimplemented>=0.1.7",
    "jieba>=0.42.1",
    "wordfreq>=3.1.1",
    "imageio-ffmpeg>=0.6; sys_platform == 'darwin'",
]

[project.optional-dependencies]
qt = ["PySide6>=6.7"]
dev = [
    "pyinstaller>=6.8",
    "PySide6>=6.7",
]

[project.scripts]
subtitle-app = "local_srt.app:main"
subtitle-worker = "local_srt.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
